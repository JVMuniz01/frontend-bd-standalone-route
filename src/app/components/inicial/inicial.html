<table mat-table [dataSource]="vendasProdutos" class="table-content mat-elevation-z8">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome do Produto </th>
    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
  </ng-container>

  <ng-container matColumnDef="total_vendido">
    <th mat-header-cell *matHeaderCellDef> Total Vendido </th>
    <td mat-cell *matCellDef="let element"> {{element.total_vendido}} </td>
  </ng-container>

  <ng-container matColumnDef="valor_total">
    <th mat-header-cell *matHeaderCellDef> Valor Total </th>
    <td mat-cell *matCellDef="let element"> {{element.valor_total}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunasVendasProdutos"></tr>
  <tr mat-row *matRowDef="let row; columns: colunasVendasProdutos;"></tr>

</table>
