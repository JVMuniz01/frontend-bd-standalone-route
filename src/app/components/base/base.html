<table mat-table [dataSource]="totalVendas" class="table-content mat-elevation-z8">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Vendedor </th>
    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
  </ng-container>

  <ng-container matColumnDef="total_produto">
    <th mat-header-cell *matHeaderCellDef> Total de Produtos Vendidos </th>
    <td mat-cell *matCellDef="let element"> {{element.total_itens_vendidos}} </td>
  </ng-container>

  <ng-container matColumnDef="valor_total_vendido">
    <th mat-header-cell *matHeaderCellDef> Valor Total Vendido </th>
    <td mat-cell *matCellDef="let element"> {{element.total_venda_real}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunasTotalVendas"></tr>
  <tr mat-row *matRowDef="let row; columns: colunasTotalVendas;"></tr>

</table>
