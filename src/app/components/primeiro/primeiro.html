<table mat-table [dataSource]="vendasCliente" class="table-content mat-elevation-z8">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome do Cliente </th>
    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
  </ng-container>

  <ng-container matColumnDef="total_compras">
    <th mat-header-cell *matHeaderCellDef> Quantidade de itens </th>
    <td mat-cell *matCellDef="let element"> {{element.total_compras}} </td>
  </ng-container>

  <ng-container matColumnDef="total_transporte">
    <th mat-header-cell *matHeaderCellDef> Valor total de Transporte </th>
    <td mat-cell *matCellDef="let element"> {{element.total_transporte}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunasVendasClientes"></tr>
  <tr mat-row *matRowDef="let row; columns: colunasVendasClientes;"></tr>

</table>
